<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.4 5.6 70.8 57.3" role="img"
     aria-label="Album Butler">
  <!-- Five photo prints fanned out like a hand of cards, in the five colours
       of the Immich logo and in the order they run around its pinwheel. The
       fan starts at yellow rather than pink so that blue, not red, is the
       print in front: the front print is the only one shown whole, and a
       red one made the icon read as an error badge. The outer prints are
       drawn first so the fan layers symmetrically towards the one in front.

       The fan is deliberately tight (28 degrees of spread per side) and the
       viewBox is cropped to the ink, so the shape still reads at favicon
       size on a browser tab; the white gaps are wide enough to survive the
       downscale to 16 px. -->
  <g stroke="#fff" stroke-width="3" stroke-linejoin="round">
    <g transform="rotate(-28 32 60)"><rect x="21" y="8" width="22" height="48" rx="3" fill="#ffb400"/></g>
    <g transform="rotate(28 32 60)"><rect x="21" y="8" width="22" height="48" rx="3" fill="#18c249"/></g>
    <g transform="rotate(-14 32 60)"><rect x="21" y="8" width="22" height="48" rx="3" fill="#ed79b5"/></g>
    <g transform="rotate(14 32 60)"><rect x="21" y="8" width="22" height="48" rx="3" fill="#fa2921"/></g>
    <rect x="21" y="8" width="22" height="48" rx="3" fill="#1e83f7"/>
  </g>
</svg>
