name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python scripts/run-tests.py -v

  no-private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the working tree
        run: python scripts/check-no-private-data.py
      - name: Check the commit messages in this push
        run: |
          git log --format=%B -n 50 > /tmp/messages.txt
          python scripts/check-no-private-data.py --commit-msg /tmp/messages.txt
